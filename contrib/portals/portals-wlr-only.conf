# Only xdg-desktop-portal-wlr and gtk, no Abyss portal at all.
# The wlr portal has no GlobalShortcuts and no InputCapture, so they are switched off explicitly.
# Copy to ~/.config/xdg-desktop-portal/abyssland-portals.conf and restart the portals.
# Alternative portals are not tested by Abyss: problems with this setup are yours to solve.
[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.InputCapture=none
