# Screen sharing and screenshots through xdg-desktop-portal-wlr, everything else stays on the Abyss portal.
# Copy to ~/.config/xdg-desktop-portal/abyssland-portals.conf and restart the portals.
# Alternative portals are not tested by Abyss: problems with this setup are yours to solve.
[preferred]
default=abyss;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
